{% extends "ojapp/base.html" %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-lg border-0 rounded-4">
                <div class="card-body text-center p-5">
                    <h2 class="text-primary fw-bold mb-3">Welcome, {{ user.username }}! 🎉</h2>
                    <p class="lead">You're successfully logged in. Here's your profile info:</p>
                    <hr class="my-4">

                    <ul class="list-group text-start mb-4">
                        <li class="list-group-item"><strong>Username:</strong> {{ user.username }}</li>
                        <li class="list-group-item"><strong>Email:</strong> {{ user.email }}</li>
                        <li class="list-group-item"><strong>Date Joined:</strong> {{ user.date_joined|date:"F j, Y" }}</li>
                    </ul>

                    <a href="{% url 'logout' %}" class="btn btn-danger btn-lg px-4">Logout</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
