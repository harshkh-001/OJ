<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{data.name}}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.2.1.slim.min.js" integrity="sha384-KJ3o2DKtIkvYIK3UENzmM7KCkRr/rE9/Qpg6aAZGJwFDMVNA/GpGFF93hXpG5KkN" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.12.9/dist/umd/popper.min.js" integrity="sha384-ApNbgh9B+Y1QKtv3Rn7W3mgPxhU9K/ScQsAP7hUibX39j7fakFPskvXusvfa0b4Q" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/js/bootstrap.min.js" integrity="sha384-JZR6Spejh4U02d8jOt6vLEHfe/JQGiRRSQQxSfFWpi1MquVdAyjUar5+76PVCmYl" crossorigin="anonymous"></script>

</head>
<body>

  {% include "./cmp_nav.html" with p_name=slug_name %}
<!-- The blackboard "screen" -->
<div id="blackboard" style="
    display: none;
    position: absolute;
    top: 150px;
    left: 150px;
    width: 600px;
    height: 600px;
    background-color: black;
    color: white;
    border-radius: 10px;
    box-shadow: 0 0 10px #000;
    resize: both;
    overflow: auto;
    z-index: 9999;
">

  <!-- Drag Header -->
  <div id="dragbar" style="
      background-color: #222;
      color: white;
      padding: 10px;
      cursor: move;
      user-select: none;
  ">
    <strong>Blackboard</strong>
    <button onclick="closeblackboard()" style="float: right;" class="btn btn-sm btn-outline-light">✖</button>
  </div>

  <!-- Blackboard Content -->
<div style="padding: 10px;">
  <button id="penBtn" onclick="togglePen()" class="btn btn-outline-secondary">Pen</button>
  <button onclick="clearCanvas()" class="btn btn-outline-primary">Clear</button>

  <div id="write" style="margin-top: 10px; border: 1px solid #555; height: 400px; resize: both; overflow: auto;">
    <canvas id="canvas" style="background: black; display: block; width: 100%; height: 100%;"></canvas>
  </div>
</div>

</div>


<!-- Notepad -->
<div id="Notepad" style="
    display: none;
    position: absolute;
    top: 200px;
    left: 200px;
    width: 300px;
    height: 250px;
    background-color: #fefefe;
    border: 1px solid #ccc;
    border-radius: 10px;
    padding: 10px;
    box-shadow: 0 0 10px rgba(0,0,0,0.2);
    resize: both;
    overflow: auto;
    z-index: 9999;
">
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <strong>Notepad</strong>
    <button onclick="openNotePad()" class="btn btn-sm btn-outline-danger">✖</button>
  </div>
  <textarea id="notepadText" placeholder="Write here..." 
    style="margin-top: 10px; width: 100%; height: calc(100% - 40px); resize: none;"></textarea>
</div>

<div class="d-flex justify-content-center mt-0">
<div class="container ms-0 p-4 shadow" style="width: 40%; min-height: 100vh; background-color: #1e1e1e; color: #f5f5f5;">
  <h3 class="mb-3">{{ data.id }}. {{ data.name }}</h3>

  <p class="fs-5 mb-4" style="line-height: 1.6;">
    {{ data.description }}
  </p>

  <div class="bg-black p-3 rounded">
    <h5 class="mb-2 text-info">Example</h5>
    {% comment %} <pre class="white-space pre-wrap">{{data.examples}}</pre> {% endcomment %}
    <pre class="text-light" style="white-space: pre-wrap;">{{ data.examples }}</pre>
  </div>
</div>
<div class="container ms-0 p-4 shadow" style="margin: 0 auto; width: 60%; background-color: #000000ff; color: #f5f5f5;">
<div class="mb-3">
  <form method="POST" action="{% url 'executes' %}">
  {% csrf_token %}
  <select class ="bg-dull" name="lang" default:"{{lang}}">
    <option value="py">Python</option>
    <option value="cpp">C++</option>
    <option value="c">C</option>
  </select>
  <textarea name="code" class="form-control bg-dark text-light" rows="20" style="font-family: 'Courier New', monospace; font-size: 14px; white-space: pre; line-height: 1.5;">{{code}}</textarea><br>
  <label>INPUT</label>
  <textarea name="input" class="form-control bg-black text-light" rows="2" style="font-family: 'Courier New', monospace; font-size: 14px; white-space: pre; line-height: 1.5;">{{input}}</textarea><br>
  <label>OUTPUT</label>
  <textarea name="output" class="form-control bg-black text-light" rows="4" style="font-family: 'Courier New', monospace; font-size: 14px; white-space: pre; line-height: 1.5;">{{output}}</textarea>
  <input type="submit" class="btn btn-primary mt-2" name="action" value="Submit">
  <input type="submit" class="btn btn-secondary mt-2" name="action" value="Run">
  <input type="hidden" name="problem_id" value="{{ data.id }}">
</form>
</div>
</div>
</div>

<script>
  const notepad = document.getElementById("Notepad");

  function openNotePad() {
    if (notepad.style.display === "none" || notepad.style.display === "") {
      notepad.style.display = "block";
    } else {
      notepad.style.display = "none";
    }
  }
</script>


<script>
  let oldData2 = null;
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");
  const write = document.getElementById("write");
  const penBtn = document.getElementById("penBtn");
  const blackboard = document.getElementById("blackboard");
  const dragbar = document.getElementById("dragbar");

  let drawing = false;
  let penEnabled = false;
  togglePen()
  // ------------------- Canvas Resize -------------------
  function resizeCanvas() {
    try {
      const oldData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      canvas.width = write.clientWidth;
      canvas.height = write.clientHeight;
      ctx.putImageData(oldData, 0, 0);
    } catch (e) {
      canvas.width = write.clientWidth;
      canvas.height = write.clientHeight;
    }
  }

  new ResizeObserver(resizeCanvas).observe(write);
  window.addEventListener("load", resizeCanvas);

  // ------------------- Drawing Logic -------------------
  function togglePen() {
    penEnabled = !penEnabled;

    if (penEnabled) {
      penBtn.classList.remove("btn-outline-secondary");
      penBtn.classList.add("btn-secondary");
      canvas.addEventListener("mousedown", startDrawing);
      canvas.addEventListener("mousemove", draw);
      canvas.addEventListener("mouseup", stopDrawing);
      canvas.addEventListener("mouseleave", stopDrawing);
    } else {
      penBtn.classList.remove("btn-secondary");
      penBtn.classList.add("btn-outline-secondary");
      canvas.removeEventListener("mousedown", startDrawing);
      canvas.removeEventListener("mousemove", draw);
      canvas.removeEventListener("mouseup", stopDrawing);
      canvas.removeEventListener("mouseleave", stopDrawing);
    }
  }

  function startDrawing(e) {
    drawing = true;
    draw(e);
  }

  function draw(e) {
    if (!drawing || !penEnabled) return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    ctx.strokeStyle = "white";
    ctx.lineWidth = 2;
    ctx.lineCap = "round";
    ctx.lineTo(x, y);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x, y);
  }

  function stopDrawing() {
    drawing = false;
    ctx.beginPath();
  }

  function clearCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    oldData2 = null;
    ctx.beginPath();
  }

  // ------------------- Blackboard Open/Close -------------------
  function openblackboard() {
  blackboard.style.display = "block";
  setTimeout(() => {
    resizeCanvas();
    if (oldData2) ctx.putImageData(oldData2, 0, 0);
  }, 0);
}

  function closeblackboard() {
    oldData2 = ctx.getImageData(0, 0, canvas.width, canvas.height);
    blackboard.style.display = "none";
  }

  // ------------------- Drag Logic -------------------
  let isDragging = false;
  let offsetX = 0, offsetY = 0;

  dragbar.addEventListener("mousedown", function (e) {
    isDragging = true;
    offsetX = e.clientX - blackboard.offsetLeft;
    offsetY = e.clientY - blackboard.offsetTop;
    document.body.style.userSelect = "none";
  });

  document.addEventListener("mousemove", function (e) {
    if (isDragging) {
      blackboard.style.left = (e.clientX - offsetX) + "px";
      blackboard.style.top = (e.clientY - offsetY) + "px";
    }
  });

  document.addEventListener("mouseup", function () {
    isDragging = false;
    document.body.style.userSelect = "auto";
  });
</script>


</body>
</html>
